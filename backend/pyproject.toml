[project]
name = "ayland-backend"
version = "0.1.0"
description = "AYLAND orchestrator, MCP servers and A2A agents (HANDBOOK §5, §7)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.22.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ayland"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Spike prompts are Mongolian test data; keep each one on a line.
"spikes/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
